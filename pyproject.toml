[project]
name = "radmuenster"
version = "0.1.0"
description = "Analysis and forecasting of bicycle traffic in Münster using open counter data"
requires-python = ">=3.11"
dependencies = [
    "altair>=5.5",
    "holidays>=0.50",
    "lightgbm>=4.3",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
app = [
    "anthropic>=1.13",
    "streamlit>=1.50",
]
dev = [
    "pytest>=8",
    "jupyterlab>=4",
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
