name: Daily forecast

on:
  schedule:
    # Cron runs on UTC: 18:00 UTC is 20:00 in summer and 19:00 in winter in
    # Münster. Scheduled runs may start late when GitHub is busy, so this
    # leaves a few hours before midnight, when "tomorrow" would become "today".
    - cron: "0 18 * * *"
  workflow_dispatch: # manual run from the Actions tab

# Write access to commit the forecast to main, to open monitoring issues and
# to publish the static page on GitHub Pages (id-token proves to Pages that
# the upload comes from this workflow)
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

# Never run two forecasts at once, they would both commit
concurrency:
  group: daily-forecast

jobs:
  forecast:
    runs-on: ubuntu-latest
    # The page URL shows up on the run's summary page
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          activate-environment: true

      - name: Install package
        run: uv pip install -e .

      - name: Get the current month for the cache key
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Final monthly files of all counting sites from earlier runs, so that
      # only the recent months are downloaded again (about 1,500 files
      # otherwise). Final files change once a month, so one cache per month
      # is enough: the first run of a month restores the latest older cache
      # (restore-keys is a prefix) and saves a new one; later runs of the
      # month find theirs and save nothing.
      - uses: actions/cache@v6
        with:
          path: data/raw
          key: raw-data-${{ steps.month.outputs.month }}
          restore-keys: raw-data-

      - name: Forecast tomorrow, run the monitoring, build the page and the data of all sites
        run: python -m radmuenster.forecast

      - name: Commit forecast to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add daily forecast of $(jq -r .checked_on forecasts/status.json)"
          # main may have moved since the checkout (e.g. a merged pull request)
          git pull --rebase origin main
          git push origin HEAD:main

      # The page is published from the folder site/ of this run, without a commit
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Report monitoring warnings as an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(jq '.warnings | length' forecasts/status.json)
          if [ "$count" -eq 0 ]; then
            echo "No warnings"
            exit 0
          fi
          body=$(jq -r '"Monitoring of " + .checked_on + ":\n\n" + (.warnings | map("- " + .) | join("\n"))' forecasts/status.json)
          gh label create monitoring --color D93F0B --description "Warnings of the daily monitoring" --force
          # One open issue collects all warnings; a new comment per day while
          # problems last. Close the issue once the cause is fixed.
          issue=$(gh issue list --label monitoring --state open --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Monitoring warnings" --label monitoring --body "$body"
          fi
          echo "::warning::$count monitoring warning(s), see the issue labelled monitoring"
